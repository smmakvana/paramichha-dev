name: Build

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/quality-build.yml
    with:
      # Use this commit's report script, not master's: a pull request adding or changing the
      # script is then tested with its own version.
      tools-ref: ${{ github.sha }}

  # The report summary script is shared by every repository's CI: test it where it lives.
  report-script:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test shared scripts and checkout line-ending repair
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
