name: Build

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/quality-build.yml
    with:
      # Use this commit's report script, not master's: a pull request adding or changing the
      # script is then tested with its own version.
      tools-ref: ${{ github.sha }}

  # The report summary script is shared by every repository's CI: test it where it lives.
  report-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test scripts/report-summary.py
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
