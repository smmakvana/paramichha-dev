# The build every Paramichha repository runs: compile, test, coverage, formatting, Checkstyle,
# PMD and SpotBugs, as `mvn verify` does on a developer's machine. The reports are attached to
# the run as "reports": unzip it and open index.html, a one-page summary of the numbers that links
# to the detail pages. The same table is shown on the run's summary page.
#
# Called from each repository's own workflow:
#
#   jobs:
#     build:
#       uses: smmakvana/paramichha-dev/.github/workflows/quality-build.yml@master
#       with:
#         dependencies: paramichha-dev paramichha-utils
name: Quality build

on:
  workflow_call:
    inputs:
      dependencies:
        description: >-
          The Paramichha repositories this one needs installed first, in build order, separated by
          spaces. They are not on Maven Central while they are SNAPSHOT versions.
        type: string
        default: ""
      owner:
        description: The GitHub account that holds those repositories.
        type: string
        default: smmakvana
      tools-ref:
        description: >-
          The branch, tag or commit of paramichha-dev to take the report script from. Leave it for
          master; set it to try a change to the script before it is merged.
        type: string
        default: master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install the projects this one depends on
        if: inputs.dependencies != ''
        env:
          DEPENDENCIES: ${{ inputs.dependencies }}
          OWNER: ${{ inputs.owner }}
        run: |
          for repo in $DEPENDENCIES; do
            git clone --quiet --depth 1 "https://github.com/$OWNER/$repo.git" "$RUNNER_TEMP/$repo"
            # Their own builds check them; here they only have to be installed.
            mvn -B -q -f "$RUNNER_TEMP/$repo/pom.xml" install -DskipTests -Djacoco.skip=true \
              -Dquality.fail=false -Dspotless.check.skip=true -Dmaven.javadoc.skip=true -Dmaven.source.skip=true
          done

      - name: Build and check
        id: build
        run: mvn -B verify

      # A failed test or check stops the build before the later reports are written.
      # Run again without stopping, so every report is there to read.
      - name: Finish the reports after a failure
        if: failure()
        continue-on-error: true
        run: >-
          mvn -B -q verify -Dmaven.test.failure.ignore=true -Dquality.fail=false
          -Dspotless.check.skip=true -Djacoco.haltOnFailure=false

      # The summary is best effort: if fetching or running the script fails, the build result stays
      # as it is. The script itself also exits 0 on any problem, with a warning.
      # Fetched after the build, so the script's folder cannot reach it.
      - name: Fetch the report script
        if: always()
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.owner }}/paramichha-dev
          ref: ${{ inputs.tools-ref }}
          path: .paramichha-dev
          sparse-checkout: scripts

      # Writes target/index.html (a one-page summary that links to the detail pages next to it)
      # and target/summary.json, and puts the table on this run's summary page.
      - name: Summary
        if: always()
        continue-on-error: true
        env:
          BUILD_RESULT: ${{ steps.build.outcome }}
        run: python3 .paramichha-dev/scripts/report-summary.py

      - name: Attach the reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          if-no-files-found: ignore
          path: |
            target/index.html
            target/summary.json
            target/site/
            target/reports/
            target/surefire-reports/
            target/checkstyle-result.xml
            target/pmd.xml
            target/cpd.xml
            target/spotbugsXml.xml
