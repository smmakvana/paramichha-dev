# The build every Paramichha repository runs: compile, test, coverage, formatting, Checkstyle,
# PMD and SpotBugs, as `mvn verify` does on a developer's machine. The reports are attached to
# the run, and the numbers are shown on the run's summary page.
#
# Called from each repository's own workflow:
#
#   jobs:
#     build:
#       uses: smmakvana/paramichha-dev/.github/workflows/quality-build.yml@master
#       with:
#         dependencies: paramichha-dev paramichha-utils
name: Quality build

on:
  workflow_call:
    inputs:
      dependencies:
        description: >-
          The Paramichha repositories this one needs installed first, in build order, separated by
          spaces. They are not on Maven Central while they are SNAPSHOT versions.
        type: string
        default: ""
      owner:
        description: The GitHub account that holds those repositories.
        type: string
        default: smmakvana

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install the projects this one depends on
        if: inputs.dependencies != ''
        env:
          DEPENDENCIES: ${{ inputs.dependencies }}
          OWNER: ${{ inputs.owner }}
        run: |
          for repo in $DEPENDENCIES; do
            git clone --quiet --depth 1 "https://github.com/$OWNER/$repo.git" "$RUNNER_TEMP/$repo"
            # Their own builds check them; here they only have to be installed.
            mvn -B -q -f "$RUNNER_TEMP/$repo/pom.xml" install -DskipTests -Djacoco.skip=true \
              -Dquality.fail=false -Dspotless.check.skip=true -Dmaven.javadoc.skip=true -Dmaven.source.skip=true
          done

      - name: Build and check
        run: mvn -B verify

      # A failed test or check stops the build before the later reports are written.
      # Run again without stopping, so every report is there to read.
      - name: Finish the reports after a failure
        if: failure()
        continue-on-error: true
        run: >-
          mvn -B -q verify -Dmaven.test.failure.ignore=true -Dquality.fail=false
          -Dspotless.check.skip=true -Djacoco.haltOnFailure=false

      - name: Summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import csv, glob, os, xml.etree.ElementTree as ET

          def count(path, tag):
              if not os.path.exists(path):
                  return None
              return sum(1 for e in ET.parse(path).iter() if e.tag.split('}')[-1] == tag)

          rows = []
          tests = failed = skipped = 0
          for f in glob.glob('target/surefire-reports/TEST-*.xml'):
              r = ET.parse(f).getroot()
              tests += int(r.get('tests', 0))
              failed += int(r.get('failures', 0)) + int(r.get('errors', 0))
              skipped += int(r.get('skipped', 0))
          if tests:
              rows.append(('Tests', f'{tests} run, {failed} failed, {skipped} skipped', 'site/surefire-report.html'))
          if os.path.exists('target/site/jacoco/jacoco.csv'):
              missed = covered = bmissed = bcovered = 0
              for row in csv.DictReader(open('target/site/jacoco/jacoco.csv')):
                  missed += int(row['LINE_MISSED']); covered += int(row['LINE_COVERED'])
                  bmissed += int(row['BRANCH_MISSED']); bcovered += int(row['BRANCH_COVERED'])
              line = 100 * covered / max(1, covered + missed)
              branch = 100 * bcovered / max(1, bcovered + bmissed)
              rows.append(('Coverage', f'{line:.1f}% of lines ({missed} missed), {branch:.1f}% of branches', 'site/jacoco/index.html'))
          for name, path, tag, page in [
                  ('Checkstyle', 'target/checkstyle-result.xml', 'error', 'reports/checkstyle.html'),
                  ('PMD', 'target/pmd.xml', 'violation', 'reports/pmd.html'),
                  ('SpotBugs', 'target/spotbugsXml.xml', 'BugInstance', 'reports/spotbugs.html'),
                  ('Duplicated code', 'target/cpd.xml', 'duplication', 'reports/cpd.html')]:
              n = count(path, tag)
              if n is not None:
                  rows.append((name, f'{n} found', page))

          print('## Quality build')
          if not rows:
              print('No reports: this project has no Java sources.')
          else:
              print('| Check | Result | Page in the `reports` download |')
              print('|---|---|---|')
              for name, result, page in rows:
                  print(f'| {name} | {result} | `{page}` |')
              print()
              print('Formatting (Spotless) has no report: the build log lists the files to format.')
          PY

      - name: Attach the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          if-no-files-found: ignore
          path: |
            target/site/
            target/reports/
            target/surefire-reports/
            target/checkstyle-result.xml
            target/pmd.xml
            target/cpd.xml
            target/spotbugsXml.xml
